<style>
/* VOICE: rotaļīgs, silts, kustīgs. Telefona spēle, nevis lapa.
   IDEA: tamagoči tipa mīlulis, kuru baro ar laipnību, ko saņem no citiem.
   PICTURE: Laipiņš lielā laipnības gredzenā. Gredzens pildās, Laipiņš kļūst priecīgāks.
   COLOUR and TYPE: koraļļu laukums, tumši violeta tinte, saulaini dzeltenas zvaigznes, piparmētru atbalsts; Baloo 2 + Nunito.
   LAYOUT: viena kolonna max 520px, mīlulis augšā, lomas pārslēgs, panelis, apakšā navigācija. */
:root{color-scheme:light dark;
--bg:#fff4ec;--hero:#ff6b4a;--hero2:#ff8f6b;
--ink:#2a1838;--mut:#7a6580;--card:#ffffff;
--line:#f1dfd3;--sun:#ffc93c;--mint:#3ccfa6;--chip:#fff0e6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}html{background:#fff4ec}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100dvh}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.btn,.seg button,.lvl{font-family:"Baloo 2",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--hero2),var(--hero));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 34px;border-radius:0 0 34px 34px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:260px;height:260px;right:-90px;top:-80px}.hero::after{width:160px;height:160px;left:-60px;bottom:-50px}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.who{font-weight:800;font-size:17px;opacity:.95}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);padding:6px 14px 6px 10px;border-radius:99px;font-weight:800;font-size:20px}
.pill svg{width:22px;height:22px}
.stage{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:8px auto 0;z-index:1}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.ring-bg{stroke:rgba(255,255,255,.22)}.ring{stroke:var(--sun);transition:stroke-dashoffset 1.4s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 0 6px rgba(255,201,60,.7))}
.pet{position:absolute;inset:14%;transform-origin:50% 90%}
.pet.hop{animation:hop .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:scale(1)}20%{transform:scale(1.15,.85)}45%{transform:translateY(-22%) scale(.95,1.08)}70%{transform:scale(1.06,.94)}100%{transform:none}}
.pet .breathe{animation:br 3.2s ease-in-out infinite;transform-origin:100px 195px}
@keyframes br{50%{transform:scale(1.025,.975)}}
.mood{text-align:center;position:relative;z-index:1;margin-top:4px}
.lvl{font-size:26px;line-height:1.1;margin:0;font-weight:800}
.next{font-size:14px;opacity:.9;margin:2px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:20px;padding:6px;margin:-22px 16px 0;position:relative;z-index:2;box-shadow:0 10px 30px rgba(80,30,40,.14)}
.seg button{padding:12px 6px;border-radius:15px;font-size:17px;font-weight:800;min-height:50px;color:var(--mut);transition:.25s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pane{padding:18px 16px 0}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
.card h2{font-size:24px;line-height:1.1;margin:0 0 8px}
.kick{font-size:13px;font-weight:800;color:var(--hero);margin:0 0 6px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-weight:700}
.steps b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--chip);font-family:"Baloo 2";font-size:18px;color:var(--hero)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:18px;font-size:20px;font-weight:800;background:var(--hero);color:#fff;box-shadow:0 5px 0 #b8402a;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8402a}
.btn.alt{background:var(--ink);color:var(--bg);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.soft{background:var(--chip);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.45}
.btn svg{width:26px;height:26px}
.gap{height:12px}
.prob{font-size:19px;font-weight:700;margin:4px 0 12px}
.secret{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-weight:700;width:100%;text-align:left}
.secret span{display:block;font-size:13px;color:var(--mut)}
.crit{display:grid;gap:10px}
.crit button{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:16px;background:var(--chip);font-weight:700;min-height:64px;transition:.2s}
.crit button .st{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--card)}
.crit button .st svg{width:28px;height:28px;fill:var(--line);transition:.25s}
.crit button[aria-pressed=true]{background:#fff3cf}
.crit button[aria-pressed=true] .st svg{fill:var(--sun);transform:rotate(-12deg) scale(1.15)}
.starsline{display:flex;justify-content:center;gap:4px;margin:14px 0}
.starsline svg{width:36px;height:36px;fill:var(--line);transition:.3s}
.starsline svg.on{fill:var(--sun)}
.qr{background:#fff;border-radius:22px;padding:14px;width:min(320px,100%);margin:6px auto 10px}
.qr svg{display:block;width:100%;height:auto}
.code{text-align:center;font-family:"Baloo 2";font-size:22px;letter-spacing:2px;font-weight:800}
.small{font-size:14px;color:var(--mut);text-align:center;margin:6px 0 0}
.recv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recv li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--chip);border-radius:14px;font-weight:700}
.recv i{font-style:normal;color:#d99a00;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.badge{background:var(--card);border-radius:22px;padding:16px 12px;text-align:center;box-shadow:0 5px 0 var(--line)}
.badge .ic{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--chip);filter:grayscale(1);opacity:.45}
.badge.got .ic{filter:none;opacity:1;background:#fff3cf}
.badge h3{margin:0;font-size:17px;line-height:1.15}
.badge p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stats div{background:var(--chip);border-radius:16px;padding:12px 4px}
.num{font-size:34px;font-weight:800;line-height:1}
.stats span{font-size:13px;color:var(--mut);font-weight:700}
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);border-radius:24px;padding:6px;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.25)}
nav.bar button{color:var(--bg);opacity:.6;font-weight:800;font-size:13px;display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:18px;min-height:56px}
nav.bar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current=true]{opacity:1;background:rgba(255,255,255,.12)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,10,28,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
.cam{position:relative;width:min(340px,90vw);aspect-ratio:1;border-radius:28px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:16%;border:4px solid var(--sun);border-radius:24px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.ov input{width:min(340px,90vw);font:800 18px "Baloo 2",sans-serif;padding:14px;border-radius:16px;border:0;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-top:14px;background:#fff;color:#2a1838}
.ov .btn{width:min(340px,90vw);margin-top:10px}
.ov p{max-width:340px;text-align:center}
.msg{font-size:15px;min-height:22px;color:var(--sun);font-weight:700}
.win h2{font-family:"Baloo 2";font-size:40px;margin:0;line-height:1}
.win .pet{position:static;width:200px;height:200px;margin:0 auto}
.fly{position:fixed;width:30px;height:30px;z-index:60;pointer-events:none;fill:var(--sun)}
.qrfull{min-height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 20px 20px}
.qrfull h2{font-size:30px;margin:0 0 8px}.qrfull .qr{width:min(340px,100%);box-shadow:0 8px 0 var(--line)}
.start{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.start h1{font-size:44px;line-height:1;margin:0 0 6px;color:var(--hero)}
.start input{width:100%;font:700 20px Nunito,sans-serif;padding:16px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin:16px 0}
.danger{color:var(--hero);font-weight:800;text-decoration:underline;padding:12px;display:block;margin:0 auto;min-height:44px}
[hidden]{display:none!important}
@media(min-width:640px){
 html{background:#ff6b4a}
 body{background:radial-gradient(circle at 15% 20%,#ff8f6b 0 180px,transparent 181px),radial-gradient(circle at 88% 75%,#ff8f6b 0 240px,transparent 241px),#ff6b4a;padding:28px 0}
 .app,.start,.qrfull{background:#fff4ec;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(60,10,20,.35);min-height:calc(100dvh - 56px)}
 .hero{border-radius:0 0 34px 34px}
 nav.bar{bottom:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

  '<path d="M86 138q14-10 28 0" stroke="#2a1838" stroke-width="5" fill="none" stroke-linecap="round"/>',
  '<path d="M89 132h22" stroke="#2a1838" stroke-width="5" stroke-linecap="round"/>',
  '<path d="M86 128q14 12 28 0" stroke="#2a1838" stroke-width="5" fill="none" stroke-linecap="round"/>',
  '<path d="M80 124q20 22 40 0z" fill="#2a1838" stroke="#2a1838" stroke-width="4" stroke-linejoin="round"/>',
  '<path d="M76 122q24 32 48 0z" fill="#2a1838" stroke="#2a1838" stroke-width="4" stroke-linejoin="round"/><path d="M88 136q12 10 24 0q-12-6-24 0z" fill="#ff6f8e"/>',
  '<path d="M74 120q26 38 52 0z" fill="#2a1838" stroke="#2a1838" stroke-width="4" stroke-linejoin="round"/><path d="M86 137q14 12 28 0q-14-8-28 0z" fill="#ff6f8e"/>'
 ][level];
 const arms=level<2?'<path d="M34 128q-14 18-6 34M166 128q14 18 6 34" stroke="'+c2+'" stroke-width="14" fill="none" stroke-linecap="round"/>'
  :level<4?'<path d="M34 124q-20 0-26 14M166 124q20 0 26 14" stroke="'+c2+'" stroke-width="14" fill="none" stroke-linecap="round"/>'
  :'<path d="M36 116q-22-10-24-38M164 116q22-10 24-38" stroke="'+c2+'" stroke-width="14" fill="none" stroke-linecap="round"/>';
 const extra=(level>=2?'<ellipse cx="62" cy="122" rx="11" ry="7" fill="#ff7a8a" opacity=".55"/><ellipse cx="138" cy="122" rx="11" ry="7" fill="#ff7a8a" opacity=".55"/>':"")
  +(level===4?'<path d="M100 32q-4-18 10-24q2 16-10 24zM100 32q-2-14-16-16q2 14 16 16z" fill="#3ccfa6"/>':"")
  +(level===5?'<path d="M70 40l8-26 14 16 8-22 8 22 14-16 8 26z" fill="#ffc93c" stroke="#2a1838" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="20" r="4" fill="#ff5fa2"/>':"")
  +(level>=3?'<g fill="#fff" opacity=".9"><path d="M22 60l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M178 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>':"")
  +(level===0?'<path d="M150 56q6 8 0 12q-6-4 0-12z" fill="#8ec5ff"/>':"");
 return `<svg viewBox="0 0 200 220" aria-label="Laipiņš: ${LV[level].name}"><defs><radialGradient id="${id}" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
 <ellipse cx="100" cy="206" rx="58" ry="9" fill="rgba(0,0,0,.18)"/>
 <g class="breathe">${arms}
 <ellipse cx="74" cy="198" rx="18" ry="9" fill="${c2}"/><ellipse cx="126" cy="198" rx="18" ry="9" fill="${c2}"/>
 <path d="M100 34C152 34 172 74 172 122C172 170 140 196 100 196C60 196 28 170 28 122C28 74 48 34 100 34Z" fill="url(#${id})"/>
 <ellipse cx="74" cy="66" rx="20" ry="12" fill="#fff" opacity=".35" transform="rotate(-25 74 66)"/>
 ${eyes}${mouth}${extra}</g></svg>`;
}

function ring(stars){
 const max=LV[5].min,f=Math.min(stars/max,1),r=46,C=2*Math.PI*r;
 const ticks=LV.slice(1,5).map(l=>{const a=l.min/max*2*Math.PI-Math.PI/2;return `<circle cx="${50+r*Math.cos(a)}" cy="${50+r*Math.sin(a)}" r="1.6" fill="#fff" opacity=".8"/>`}).join("");
 return `<svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="${r}" fill="none" stroke-width="5"/>
 <circle id="ringc" class="ring" cx="50" cy="50" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 50 50)"/>${ticks}</svg>`;
}

function render(){
 if(!S){
  $("#root").innerHTML=`<div class="start"><div style="width:200px;margin:0 auto">${pet(0)}</div>
  <h1>Laipiņš</h1><p style="font-size:18px;margin:0">Šis ir Laipiņš, un šobrīd viņš ir bēdīgs. Palīdzi citiem atrisināt viņu problēmas. Katra saņemtā zvaigzne padarīs Laipiņu priecīgāku.</p>
  <input id="nm" maxlength="20" placeholder="Tavs vārds" autocomplete="off">
  <button class="btn" id="go">Sākt spēli</button></div>`;
  $("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}
   S={id:rnd(4),name:n,stars:0,recv:[],gave:0,used:{},role:"solve",badges:[]};save();render()};
  return;
 }
 if(tab==="game"&&S.role==="prob"&&phase==="qr"){
  $("#root").innerHTML=`<div class="qrfull"><p class="kick">Ļauj palīdzētājam noskenēt</p><h2>${pc(mask)} ★ zvaigznes gatavas!</h2>
  <div class="qr">${qrSvg(code.payload)}</div><div class="code">${code.short}</div><p class="small">Ja kamera nestrādā, palīdzētājs var ievadīt šo kodu ar roku</p>
  <div class="gap"></div><button class="btn alt" id="done">Gatavs, nākamā problēma</button></div>`;bind();return;
 }
 const L=lvOf(S.stars),nx=LV[L+1];
 let body="";
 if(tab==="game")body=S.role==="solve"?solvePane():probPane();
 if(tab==="badges")body=badgePane();
 if(tab==="me")body=mePane();
 $("#root").innerHTML=`<div class="app">
 <section class="hero"><div class="top"><span class="who">${esc(S.name)}</span><span class="pill" id="pill">${STAR}<span id="cnt">${S.stars}</span></span></div>
 <div class="stage">${ring(S.stars)}<div class="pet" id="pet">${pet(L)}</div></div>
 <div class="mood"><p class="lvl">${LV[L].name}</p><p class="next">${nx?`Līdz nākamajam līmenim vēl ${nx.min-S.stars} ★`:"Laipiņš ir laimīgākais pasaulē!"}</p></div></section>
 ${tab==="game"?`<div class="seg"><button data-r="solve" aria-pressed="${S.role==="solve"}">Es palīdzu</button><button data-r="prob" aria-pressed="${S.role==="prob"}">Man ir problēma</button></div>`:""}
 <div class="pane" ${tab!=="game"?'style="padding-top:22px"':""}>${body}</div></div>
 <nav class="bar">
  <button data-t="game" aria-current="${tab==="game"}"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19l1-5.8-4.3-4.1 5.9-.8z"/></svg>Spēle</button>
  <button data-t="badges" aria-current="${tab==="badges"}"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>Sasniegumi</button>
  <button data-t="me" aria-current="${tab==="me"}"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Rezultāts</button>
 </nav>`;
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.role=b.dataset.r;save();phase="card";render()});
 bind();
}

function solvePane(){
 const last=S.recv.slice(-4).reverse();
 return `<div class="card"><p class="kick">Tava misija</p><h2>Atrodi kādu ar problēmu un palīdzi</h2>
 <ol class="steps"><li><b>1</b>Pieej kādam, kam ir izvēlēts “Man ir problēma”</li><li><b>2</b>Uzklausi un uzdod jautājumus</li><li><b>3</b>Piedāvā vismaz 2 risinājumus un paskaidro</li><li><b>4</b>Noskenē viņa kodu un saņem zvaigznes</li></ol></div>
 <button class="btn" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 12h10"/></svg>Skenēt zvaigznes</button>
 <div class="gap"></div>
 ${last.length?`<div class="card"><p class="kick">Pēdējās zvaigznes</p><ul class="recv">${last.map(r=>`<li><span>${esc(r.n)}</span><i>${"★".repeat(pc(r.m))}${"☆".repeat(5-pc(r.m))}</i></li>`).join("")}</ul></div>`:""}`;
}

function probPane(){
 if(phase==="card"){const p=PROBS[pi];
  return `<div class="card"><p class="kick">Tava problēma · izstāsti to saviem vārdiem</p><p class="prob">${esc(p[0])}</p>
  <button class="secret" id="sec"><span>Slēptā detaļa · stāsti tikai tad, ja pajautā</span>${secret?esc(p[1]):"Pieskaries, lai redzētu"}</button></div>
  <button class="btn" id="rate">Novērtēt palīdzētāju</button><div class="gap"></div>
  <button class="btn soft" id="newp">Cita problēma</button>`;}
 if(phase==="rate"){const n=pc(mask);
  return `<div class="card"><p class="kick">Atzīmē godīgi, ko palīdzētājs izdarīja</p><h2>Ko viņš izdarīja?</h2>
  <div class="crit">${CRIT.map((c,i)=>`<button data-c="${i}" aria-pressed="${!!(mask>>i&1)}"><span class="st">${STAR}</span>${c}</button>`).join("")}</div>
  <div class="starsline">${CRIT.map((_,i)=>STAR.replace("<svg",`<svg class="${i<n?"on":""}"`)).join("")}</div>
  <button class="btn" id="mk">Izveidot kodu · ${n} ★</button><div class="gap"></div><button class="btn soft" id="back">Atpakaļ</button></div>`;}
 if(phase==="qr")return `<div class="card" style="text-align:center"><p class="kick">Ļauj palīdzētājam noskenēt</p><h2>${"★".repeat(pc(mask))} dāvana gatava!</h2>
  <div class="qr">${qrSvg(code.payload)}</div><div class="code">${code.short}</div><p class="small">Ja kamera nestrādā, palīdzētājs var ievadīt šo kodu ar roku</p></div>
  <button class="btn alt" id="done">Gatavs, nākamā problēma</button>`;
}

function badgePane(){
 return `<div class="badges">${BADGES.map(b=>{const got=b.ok(S);return `<div class="badge ${got?"got":""}"><div class="ic" style="font-size:32px;color:#e0a100">${b.ic}</div><h3>${b.t}</h3><p>${got?"Iegūts!":b.d}</p></div>`}).join("")}</div>`;
}

function mePane(){
 const five=S.recv.filter(r=>pc(r.m)===5).length,got=BADGES.filter(b=>b.ok(S)).length;
 const tally=CRIT.map((c,i)=>({c,n:S.recv.filter(r=>r.m>>i&1).length}));
 const best=S.recv.length?tally.reduce((a,b)=>b.n>a.n?b:a):null,weak=S.recv.length?tally.reduce((a,b)=>b.n<a.n?b:a):null;
 return `<div class="card"><p class="kick">Parādi šo ekrānu instruktoram</p><h2>${esc(S.name)}</h2>
 <div class="stats"><div><div class="num">${S.stars}</div><span>zvaigznes</span></div><div><div class="num">${S.recv.length}</div><span>palīdzēji</span></div><div><div class="num">${S.gave}</div><span>novērtēji</span></div></div>
 <p class="small" style="margin-top:12px">${five}× ideāls padoms · ${got}/${BADGES.length} sasniegumi</p></div>
 ${best?`<div class="card"><p class="kick">Tava stiprā puse</p><p class="prob" style="margin:0 0 10px">${best.c}</p><p class="kick">Nākamreiz pamēģini vairāk</p><p class="prob" style="margin:0">${TIPS[tally.indexOf(weak)]}</p></div>`:""}
 <div class="card" style="text-align:center"><p class="kick">Pievieno draugu spēlei</p><div class="qr" style="width:200px">${qrSvg(location.href.split("#")[0])}</div></div>
 <button class="danger" id="reset">Sākt no jauna</button>`;
}

function qrSvg(t){const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}

function bind(){
 const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
 on("#scan",openScan);
 on("#sec",()=>{secret=!secret;render()});
 on("#newp",()=>{pi=(pi+1+Math.floor(Math.random()*(PROBS.length-1)))%PROBS.length;secret=false;render()});
 on("#rate",()=>{phase="rate";mask=0;render()});
 on("#back",()=>{phase="card";render()});
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{mask^=1<<+b.dataset.c;const y=scrollY;render();scrollTo(0,y)});
 on("#mk",()=>{const short=`${S.id}-${mask.toString(36).toUpperCase()}-${rnd(4)}`;const sc=`${short}-${hash(short+SALT)}`;
  code={short:sc,payload:`LAIP:${sc}:${encodeURIComponent(S.name)}`};S.gave++;save();phase="qr";render();scrollTo(0,0)});
 on("#done",()=>{phase="card";code=null;secret=false;pi=(pi+1+Math.floor(Math.random()*(PROBS.length-1)))%PROBS.length;render()});
 on("#reset",()=>{const b=$("#reset");if(b.dataset.sure){try{localStorage.removeItem("laipins")}catch(e){}S=null;tab="game";render()}else{b.dataset.sure=1;b.textContent="Tiešām dzēst visas zvaigznes? Pieskaries vēlreiz"}});
}

/* --- skenēšana --- */
let stream=null,raf=0;
function openScan(){
 const ov=document.createElement("div");ov.className="ov";ov.id="ov";
 ov.innerHTML=`<div class="cam"><video id="vid" playsinline muted></video></div><p class="msg" id="msg">Notēmē kameru uz QR kodu</p>
 <input id="man" placeholder="vai ievadi kodu" autocomplete="off" autocapitalize="characters"><button class="btn" id="mok">Pievienot</button><button class="btn soft" id="cls">Aizvērt</button>`;
 document.body.appendChild(ov);
 $("#cls").onclick=closeScan;
 $("#mok").onclick=()=>take($("#man").value);
 startCam();
}
async function startCam(){
 const v=$("#vid"),cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});v.srcObject=stream;await v.play()}
 catch(e){$("#msg").textContent="Kamera nav pieejama, ievadi kodu ar roku.";return}
 const loop=()=>{if(!stream)return;
  if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*sc|0;cv.height=v.videoHeight*sc|0;
   cx.drawImage(v,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height);
   const r=jsQR(d.data,cv.width,cv.height,{inversionAttempts:"dontInvert"});if(r&&r.data&&take(r.data))return}
  raf=requestAnimationFrame(loop)};
 loop();
}
function closeScan(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const o=$("#ov");if(o)o.remove()}
function take(txt){
 const msg=t=>{const m=$("#msg");if(m)m.textContent=t};
 let s=String(txt).trim(),name="";
 if(s.startsWith("LAIP:")){const p=s.slice(5).split(":");s=p[0];try{name=decodeURIComponent(p[1]||"")}catch(e){}}
 const parts=s.toUpperCase().replace(/\s/g,"").split("-");
 if(parts.length!==4){msg("Šis nav Laipiņa kods");return false}
 const [did,m36,non,chk]=parts,short=`${did}-${m36}-${non}`;
 if(hash(short+SALT)!==chk){msg("Kods nav derīgs, pārbaudi burtus");return false}
 if(did===S.id){msg("Savu kodu skenēt nedrīkst 😉");return false}
 if(S.used[short]){msg("Šis kods jau ir izmantots");return false}
 if(S.recv.some(r=>r.g===did)){msg("Šis cilvēks tev jau deva zvaigznes. Atrodi kādu citu!");return false}
 const m=parseInt(m36,36);if(!(m>=0&&m<32)){msg("Kods nav derīgs");return false}
 const before=lvOf(S.stars),oldB=BADGES.filter(b=>b.ok(S)).map(b=>b.id);
 S.used[short]=1;S.recv.push({g:did,n:name||("Dalībnieks "+did),m,t:Date.now()});S.stars+=pc(m);save();
 closeScan();reward(pc(m),m,name,before,oldB);return true;
}
function reward(n,m,name,before,oldB){
 const after=lvOf(S.stars),newB=BADGES.filter(b=>b.ok(S)&&!oldB.includes(b.id));
 tab="game";render();scrollTo(0,0);
 if(navigator.vibrate)try{navigator.vibrate([60,40,120])}catch(e){}
 const ringc=$("#ringc");if(ringc){const C=+ringc.getAttribute("stroke-dasharray");const prev=Math.min((S.stars-n)/LV[5].min,1);const cur=ringc.getAttribute("stroke-dashoffset");ringc.style.transition="none";ringc.setAttribute("stroke-dashoffset",C*(1-prev));ringc.getBoundingClientRect();ringc.style.transition="";ringc.setAttribute("stroke-dashoffset",cur)}
 const cnt=$("#cnt");let k=S.stars-n;cnt.textContent=k;
 const pill=$("#pill").getBoundingClientRect();
 for(let i=0;i<Math.max(n,1)*3;i++){const f=document.createElement("div");f.innerHTML=STAR;const s=f.firstChild;s.classList.add("fly");
  const x0=innerWidth/2+(Math.random()-.5)*160,y0=innerHeight*.55+(Math.random()-.5)*120;s.style.left=x0+"px";s.style.top=y0+"px";document.body.appendChild(s);
  s.animate([{transform:"scale(0) rotate(0)",opacity:0},{transform:"scale(1.4) rotate(90deg)",opacity:1,offset:.3},{transform:`translate(${pill.left+20-x0}px,${pill.top+8-y0}px) scale(.6) rotate(260deg)`,opacity:1}],{duration:900+i*70,easing:"cubic-bezier(.5,0,.6,1)"}).onfinish=()=>{s.remove();if(k<S.stars&&i%3===2){k++;cnt.textContent=k}}}
 setTimeout(()=>{cnt.textContent=S.stars;const p=$("#pet");if(p){p.classList.remove("hop");p.getBoundingClientRect();p.classList.add("hop")}},900+n*3*70);
 const missing=TIPS.filter((_,i)=>!(m>>i&1));
 setTimeout(()=>{const ov=document.createElement("div");ov.className="ov win";
  ov.innerHTML=`${after>before?`<div class="pet">${pet(after)}</div><h2>Jauns līmenis!</h2><p style="font-size:20px;font-weight:800">${LV[after].name}</p>`:`<h2>+${n} ★</h2>`}
  <p>No: <b>${esc(name||"draugs")}</b></p>${missing.length?`<p style="opacity:.85">Nākamreiz pamēģini: ${esc(missing[0])}</p>`:`<p>Ideāls padoms!</p>`}
  ${newB.map(b=>`<p style="font-weight:800;color:var(--sun)">Jauns sasniegums: ${b.t}</p>`).join("")}<button class="btn" id="ok">Super!</button>`;
  document.body.appendChild(ov);$("#ok").onclick=()=>ov.remove()},after>before?1700:1500);
}
render();
}
</script>
</body>
</html>
